<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 550" role="img" aria-labelledby="title desc">
  <title id="title">8x B300 BF16 distributed layerwise offload Pareto frontier</title>
  <desc id="desc">A scatter plot of steady request latency against engine-reported peak HBM. Blue markers are non-dominated policies and gray markers are dominated policies. Zero resident DiT blocks is the minimum-memory endpoint, while no offload is the fastest endpoint.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #242424; }
    .grid { stroke: #e6e6e6; stroke-width: 1; } .frame { fill: none; stroke: #a19f9d; stroke-width: 1; }
    .axis { font-size: 15px; font-weight: 600; } .tick { font-size: 13px; fill: #605e5c; } .label { font-size: 13px; font-weight: 600; } .note { font-size: 13px; fill: #605e5c; }
    .frontier { fill: none; stroke: #0078d4; stroke-width: 2.5; stroke-linejoin: round; } .frontier-dot { fill: #0078d4; stroke: #ffffff; stroke-width: 2.5; } .dominated-dot { fill: #ffffff; stroke: #a19f9d; stroke-width: 2.5; }
  </style>
  <rect width="920" height="550" fill="#ffffff" />
  <text x="120" y="30" font-size="21" font-weight="700">8× B300 BF16 DLO Pareto frontier</text>
  <text x="120" y="52" class="note">5.175 s FL2VA · SP8/Ulysses8 · AllGather · mean of requests 2–3</text>
  <rect class="frame" x="120" y="75" width="720" height="365" />
  <g class="grid">
    <line x1="120" y1="440" x2="840" y2="440" /><line x1="120" y1="394" x2="840" y2="394" /><line x1="120" y1="349" x2="840" y2="349" /><line x1="120" y1="303" x2="840" y2="303" /><line x1="120" y1="258" x2="840" y2="258" /><line x1="120" y1="212" x2="840" y2="212" /><line x1="120" y1="166" x2="840" y2="166" /><line x1="120" y1="121" x2="840" y2="121" /><line x1="120" y1="75" x2="840" y2="75" />
    <line x1="208" y1="75" x2="208" y2="440" /><line x1="384" y1="75" x2="384" y2="440" /><line x1="559" y1="75" x2="559" y2="440" /><line x1="735" y1="75" x2="735" y2="440" />
  </g>
  <g class="tick" text-anchor="end"><text x="111" y="444">10</text><text x="111" y="398">20</text><text x="111" y="353">30</text><text x="111" y="307">40</text><text x="111" y="262">50</text><text x="111" y="216">60</text><text x="111" y="170">70</text><text x="111" y="125">80</text><text x="111" y="79">90</text></g>
  <g class="tick" text-anchor="middle"><text x="208" y="462">26.0</text><text x="384" y="462">27.0</text><text x="559" y="462">28.0</text><text x="735" y="462">29.0</text></g>
  <text class="axis" x="480" y="510" text-anchor="middle">Steady request latency (seconds, lower is better)</text>
  <text class="axis" transform="translate(28 258) rotate(-90)" text-anchor="middle">Engine-reported peak HBM (GiB, lower is better)</text>
  <polyline class="frontier" points="188,110 338,174 420,249 501,276 750,415" />
  <g><circle class="frontier-dot" cx="188" cy="110" r="7" /><text class="label" x="198" y="101">No offload</text><circle class="frontier-dot" cx="338" cy="174" r="7" /><text class="label" x="348" y="165">50 resident</text><circle class="frontier-dot" cx="420" cy="249" r="7" /><text class="label" x="430" y="240">35 resident</text><circle class="frontier-dot" cx="501" cy="276" r="7" /><text class="label" x="511" y="294">30 resident</text><circle class="frontier-dot" cx="750" cy="415" r="7" /><text class="label" x="740" y="434" text-anchor="end">0 resident</text></g>
  <g><circle class="dominated-dot" cx="482" cy="221" r="6" /><text class="note" x="492" y="211">40 resident</text><circle class="dominated-dot" cx="760" cy="333" r="6" /><text class="note" x="770" y="324">20 resident</text><circle class="dominated-dot" cx="783" cy="388" r="6" /><text class="note" x="792" y="381">10 resident</text></g>
  <g transform="translate(120 535)"><circle class="frontier-dot" cx="7" cy="-5" r="6" /><text class="note" x="20" y="0">Non-dominated policy</text><circle class="dominated-dot" cx="220" cy="-5" r="6" /><text class="note" x="233" y="0">Dominated policy</text></g>
</svg>
